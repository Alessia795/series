<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="episode.js"></script>
    <title>Episodios</title>
    <link rel="icon" type="image/x-icon" href="cinematografico.ico">
    <link rel="stylesheet" href="styles.css" />
</head>

<body onload="readEpisodes()" class="body">
    <div id="navbar"></div>
    <h1 id="serie-titulo" class="title"></h1>
    <div id="addEpisode"></div>
    <div class="columnas">
        <div class="columna-izquierda">
            <div class="info-card">
                <div id="serie-imagen"></div>
                <p id="serie-genero" class="season-genre"></p>
                <p id="serie-descripcion" class="season-description"></p>
            </div>
        </div>
        <div class="columna-derecha">
            <div class="temporada-card">
                <p id="temporada" class="temporada-titulo"></p>
                <div id="episodios"></div>
            </div>
        </div>
    </div>
</body>

</html>
