<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="login.js"></script>
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="cinematografico.ico">
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="body">
    <h1 class="title">Maratón</h1>
    <div class="login-card">
        <h2 class="login-titulo">Iniciar sesión</h2>
        <input class="login-input" type="text" id="username" placeholder="Usuario" />
        <input class="login-input" type="password" id="password" placeholder="Contraseña" />
        <div class="container-btn">
            <button class="login-btn" onclick="login()">Entrar</button>
        </div>
        <p id="error" class="login-error"></p>

    </div>
</body>

</html>
