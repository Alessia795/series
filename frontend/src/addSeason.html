<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="addSeason.js"></script>
    <title>Añadir Temporada</title>
    <link rel="icon" type="image/x-icon" href="cinematografico.ico">
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="body">
    <div id="navbar"></div>
    <h1 class="title">Añadir Temporada</h1>
    <div class="login-card">
        <input class="login-input" type="integer" id="numero" placeholder="Numero Temporada" />
        <input class="login-input" type="text" id="descripcion" placeholder="Descripción" />
        <div class="container-btn">
            <button class="login-btn" onclick="addSeason()">Añadir</button>
            <button class="login-btn" onclick="cancelar()">Cancelar</button>
        </div>

    </div>
</body>

</html>
